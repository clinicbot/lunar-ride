<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1024" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x2="0" y2="1">
    <stop stop-color="#8da9b3"/>
    <stop offset=".48" stop-color="#bac9c8"/>
    <stop offset=".76" stop-color="#d6d8ce"/>
    <stop offset="1" stop-color="#aab7af"/>
  </linearGradient>
  <linearGradient id="haze" x2="0" y2="1">
    <stop stop-color="#d9dfda" stop-opacity="0"/>
    <stop offset=".42" stop-color="#cbd4cd" stop-opacity=".18"/>
    <stop offset="1" stop-color="#aebbb4" stop-opacity=".30"/>
  </linearGradient>
  <filter id="cloud"><feGaussianBlur stdDeviation="34"/></filter>
  <filter id="veil"><feGaussianBlur stdDeviation="58"/></filter>
</defs>
<rect width="2048" height="1024" fill="url(#sky)"/>

<!-- v128: atmosphere only.  There are deliberately NO painted mountain,
     hill, dome or triangular skyline silhouettes in this panorama.  All
     landscape silhouette now comes from the real 3-D terrain. -->
<g fill="#edf1ec" opacity=".30" filter="url(#cloud)">
  <ellipse cx="245" cy="245" rx="300" ry="72"/>
  <ellipse cx="610" cy="300" rx="390" ry="84"/>
  <ellipse cx="1120" cy="220" rx="330" ry="70"/>
  <ellipse cx="1645" cy="285" rx="430" ry="88"/>
  <ellipse cx="2010" cy="215" rx="250" ry="64"/>
</g>

<!-- Broad, non-silhouette mist banks soften the horizon without introducing
     any shape that can be mistaken for geometry. -->
<g fill="#e2e8e3" opacity=".17" filter="url(#veil)">
  <ellipse cx="280" cy="780" rx="520" ry="120"/>
  <ellipse cx="980" cy="805" rx="680" ry="138"/>
  <ellipse cx="1710" cy="770" rx="570" ry="118"/>
</g>
<rect y="690" width="2048" height="334" fill="url(#haze)"/>
</svg>
