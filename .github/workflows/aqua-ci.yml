name: Aqua Rift checks

on:
  push:
    branches: [fixes-build-90]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aqua-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aqua JavaScript syntax
        run: |
          node --check js/49-aqua-rift-v143.js
          node --check js/50-aqua-real-fish-v144.js
          node --check js/51-aqua-fish-visibility-v145.js
          node --check js/52-aqua-depth-distribution-v146.js
          node --check js/53-aqua-swim-motion-v147.js
          node --check js/54-aqua-tail-animation-v148.js
          node --check js/55-aqua-uturn-continuity-v149.js
          node --check js/56-aqua-faces-reef-v150.js
          node --check tests/aqua-rift-v143-smoke.js
          node --check tests/aqua-v144-real-fish-smoke.js
          node --check tests/aqua-v145-fish-visibility-smoke.js
          node --check tests/aqua-v146-depth-distribution-smoke.js
          node --check tests/aqua-v147-swim-motion-smoke.js
          node --check tests/aqua-v148-tail-animation-smoke.js
          node --check tests/aqua-v149-uturn-continuity-smoke.js
          node --check tests/aqua-v150-faces-reef-smoke.js

      - name: Aqua Rift v143 base runtime smoke
        run: node tests/aqua-rift-v143-smoke.js

      - name: Aqua Rift v144 real fish and reef regression
        run: node tests/aqua-v144-real-fish-smoke.js

      - name: Aqua Rift v145 fish visibility and fauna isolation regression
        run: node tests/aqua-v145-fish-visibility-smoke.js

      - name: Aqua Rift v146 water-column distribution regression
        run: node tests/aqua-v146-depth-distribution-smoke.js

      - name: Aqua Rift v147 horizontal swimming motion regression
        run: node tests/aqua-v147-swim-motion-smoke.js

      - name: Aqua Rift v148 horizontal body and tail animation regression
        run: node tests/aqua-v148-tail-animation-smoke.js

      - name: Aqua Rift v149 U-turn continuity regression
        run: node tests/aqua-v149-uturn-continuity-smoke.js

      - name: Aqua Rift v150 faces and reef-only seafloor regression
        run: node tests/aqua-v150-faces-reef-smoke.js

      - name: Validate imported Quaternius fish assets
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const names=['clownfish','fish-a','fish-b','fish-c','shark','anglerfish','puffer','lionfish','butterfly-fish','swordfish','black-lionfish'];
          let transformed=0;
          for(const n of names){
            const f=path.join('assets/models/aqua_fish',n+'.gltf'),j=JSON.parse(fs.readFileSync(f,'utf8'));
            if(j.asset?.version!=='2.0'||!j.meshes?.length)throw new Error('invalid fish asset '+n);
            if(!j.buffers?.[0]?.uri?.startsWith('data:application/octet-stream;base64,'))throw new Error('fish buffer not embedded '+n);
            if(!(j.animations?.length>0))throw new Error('source animation missing '+n);
            if((j.nodes||[]).some(x=>Array.isArray(x.scale)&&Math.max(...x.scale)>=99))transformed++;
            console.log('ok',n,'meshes',j.meshes.length,'animations',j.animations.length,'materials',j.materials?.length||0);
          }
          if(!transformed)throw new Error('expected imported FBX2glTF node scale was not found; v145 actor transform assumption must be reviewed');
          const prov=fs.readFileSync('assets/models/aqua_fish/PROVENANCE.md','utf8');
          if(!prov.includes('Quaternius')||!prov.includes('CC0')||!prov.includes('e160070ede35d2d1a62c7572e8b348211c58fe83'))throw new Error('fish provenance incomplete');
          NODE

      - name: Verify Aqua v150 runtime wiring and offline cache
        run: |
          node - <<'NODE'
          const fs=require('fs'),R=f=>fs.readFileSync(f,'utf8');
          const loader=R('js/19-verdant-assets.js'),sw=R('sw.js'),aqua=R('js/49-aqua-rift-v143.js'),fish=R('js/50-aqua-real-fish-v144.js'),fix=R('js/51-aqua-fish-visibility-v145.js'),depth=R('js/52-aqua-depth-distribution-v146.js'),swim=R('js/53-aqua-swim-motion-v147.js'),tail=R('js/54-aqua-tail-animation-v148.js'),turn=R('js/55-aqua-uturn-continuity-v149.js'),reef=R('js/56-aqua-faces-reef-v150.js');
          for(const f of ['49-aqua-rift-v143.js','50-aqua-real-fish-v144.js','51-aqua-fish-visibility-v145.js','52-aqua-depth-distribution-v146.js','53-aqua-swim-motion-v147.js','54-aqua-tail-animation-v148.js','55-aqua-uturn-continuity-v149.js','56-aqua-faces-reef-v150.js'])
            if(!loader.includes(f+'?b=150'))throw new Error('Aqua v150 fresh loader wiring missing '+f);
          if(!sw.includes("lunar-ride-v142"))throw new Error('retained Verdant v142 service-worker cache missing');
          const names=['clownfish','fish-a','fish-b','fish-c','shark','anglerfish','puffer','lionfish','butterfly-fish','swordfish','black-lionfish'];
          for(const f of ['js/49-aqua-rift-v143.js','js/50-aqua-real-fish-v144.js','js/51-aqua-fish-visibility-v145.js','js/52-aqua-depth-distribution-v146.js','js/53-aqua-swim-motion-v147.js','js/54-aqua-tail-animation-v148.js','js/55-aqua-uturn-continuity-v149.js','js/56-aqua-faces-reef-v150.js','assets/images/aqua_rift_card.svg'])if(!sw.includes(f))throw new Error('Aqua cache missing '+f);
          for(const n of names)if(!sw.includes('assets/models/aqua_fish/'+n+'.gltf'))throw new Error('Aqua fish cache missing '+n);
          if(!fs.existsSync('assets/images/aqua_rift_card.svg'))throw new Error('Aqua world card missing');
          for(const k of ["name:'Aqua Rift — Glass Ocean'","customWorld:AQUA_ID","w.glass=meshOf(glass)","w.water=meshOf(wm)","w.__aquaRiftV143"])
            if(!aqua.includes(k))throw new Error('Aqua v143 runtime marker missing '+k);
          for(const k of ["VERSION=144","aquaFish:true","w.__aquaFishV144","source:'Quaternius CC0'"])
            if(!fish.includes(k))throw new Error('Aqua v144 runtime marker missing '+k);
          for(const k of ["VERSION=145","MODEL_SCALE_FACTOR=100","MODEL_PITCH=-Math.PI/2","hardFaunaIsolation:true","w.__aquaFishV145"])
            if(!fix.includes(k))throw new Error('Aqua v145 runtime marker missing '+k);
          for(const k of ["VERSION=146","HEIGHT_BANDS=[-1.5,1.0,4.0,8.0,12.0]","bilateral:true","fullWaterColumn:true","w.__aquaFishV146"])
            if(!depth.includes(k))throw new Error('Aqua v146 runtime marker missing '+k);
          for(const k of ["VERSION=147","VERTICAL_DRIFT=.18","horizontal-elliptical-swim","headingFollowsVelocity:true","removesDroneBob:true"])
            if(!swim.includes(k))throw new Error('Aqua v147 runtime marker missing '+k);
          for(const k of ["VERSION=148","FRAME_COUNT=24","TAIL_AMPLITUDE=.075","horizontalTailPlane:true","faceEnhanced:true","aquaTailAnimated:true","world.__aquaFishV148"])
            if(!tail.includes(k))throw new Error('Aqua v148/v150 face runtime marker missing '+k);
          for(const k of ["VERSION=149","CAPTURE_RADIUS=135","HOLD_SECONDS=1.15","REJOIN_SECONDS=2.35","uTurnLocalContinuity:true","worldRebuild:false","fishRespawn:false"])
            if(!turn.includes(k))throw new Error('Aqua v149 runtime marker missing '+k);
          for(const k of ["VERSION=150","reefOnly:true","genericPropsDiscarded:true","mountainTerrainReplaced:true","screensRemoved:true","faceGeometryFromV148:true"])
            if(!reef.includes(k))throw new Error('Aqua v150 runtime marker missing '+k);
          if(!loader.includes('48-verdant-mushroom-carpet-fix-v142.js?b=142'))throw new Error('Verdant v142 wiring was disturbed');
          console.log('ok: Aqua v150 adds readable fish faces and a reef-only low seabed with no leaked land scenery while Verdant v142 remains intact');
          NODE