name: Aqua Rift checks

on:
  push:
    branches: [fixes-build-90]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aqua-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aqua JavaScript syntax
        run: |
          for f in \
            js/49-aqua-rift-v143.js \
            js/50-aqua-real-fish-v144.js \
            js/51-aqua-fish-visibility-v145.js \
            js/52-aqua-depth-distribution-v146.js \
            js/53-aqua-swim-motion-v147.js \
            js/54-aqua-tail-animation-v148.js \
            js/55-aqua-uturn-continuity-v149.js \
            js/56-aqua-faces-reef-v150.js \
            js/57-aqua-coral-jelly-v151.js \
            js/58-aqua-proper-jelly-reef-v152.js \
            js/59-aqua-hq-coral-v153.js \
            js/60-aqua-hero-coral-v154.js \
            tests/aqua-rift-v143-smoke.js \
            tests/aqua-v144-real-fish-smoke.js \
            tests/aqua-v145-fish-visibility-smoke.js \
            tests/aqua-v146-depth-distribution-smoke.js \
            tests/aqua-v147-swim-motion-smoke.js \
            tests/aqua-v148-tail-animation-smoke.js \
            tests/aqua-v149-uturn-continuity-smoke.js \
            tests/aqua-v150-faces-reef-smoke.js \
            tests/aqua-v151-coral-jelly-smoke.js \
            tests/aqua-v152-proper-jelly-reef-smoke.js \
            tests/aqua-v153-hq-coral-smoke.js \
            tests/aqua-v154-hero-coral-smoke.js
          do
            node --check "$f"
          done

      - name: Aqua v143-v154 runtime regressions
        run: |
          node tests/aqua-rift-v143-smoke.js
          node tests/aqua-v144-real-fish-smoke.js
          node tests/aqua-v145-fish-visibility-smoke.js
          node tests/aqua-v146-depth-distribution-smoke.js
          node tests/aqua-v147-swim-motion-smoke.js
          node tests/aqua-v148-tail-animation-smoke.js
          node tests/aqua-v149-uturn-continuity-smoke.js
          node tests/aqua-v150-faces-reef-smoke.js
          node tests/aqua-v151-coral-jelly-smoke.js
          node tests/aqua-v152-proper-jelly-reef-smoke.js
          node tests/aqua-v153-hq-coral-smoke.js
          node tests/aqua-v154-hero-coral-smoke.js

      - name: Validate imported Quaternius fish assets
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const names=['clownfish','fish-a','fish-b','fish-c','shark','anglerfish','puffer','lionfish','butterfly-fish','swordfish','black-lionfish'];
          let transformed=0;
          for(const n of names){
            const f=path.join('assets/models/aqua_fish',n+'.gltf'),j=JSON.parse(fs.readFileSync(f,'utf8'));
            if(j.asset?.version!=='2.0'||!j.meshes?.length)throw new Error('invalid fish asset '+n);
            if(!j.buffers?.[0]?.uri?.startsWith('data:application/octet-stream;base64,'))throw new Error('fish buffer not embedded '+n);
            if(!(j.animations?.length>0))throw new Error('source animation missing '+n);
            if((j.nodes||[]).some(x=>Array.isArray(x.scale)&&Math.max(...x.scale)>=99))transformed++;
            console.log('ok',n,'meshes',j.meshes.length,'animations',j.animations.length,'materials',j.materials?.length||0);
          }
          if(!transformed)throw new Error('expected imported FBX2glTF node scale was not found; v145 actor transform assumption must be reviewed');
          const prov=fs.readFileSync('assets/models/aqua_fish/PROVENANCE.md','utf8');
          if(!prov.includes('Quaternius')||!prov.includes('CC0')||!prov.includes('e160070ede35d2d1a62c7572e8b348211c58fe83'))throw new Error('fish provenance incomplete');
          NODE

      - name: Validate shared project jellyfish asset
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('assets/models/creature_jelly.gltf','utf8'));
          if(j.asset?.version!=='2.0'||!j.meshes?.length)throw new Error('shared creature_jelly.gltf is invalid');
          const setup=fs.readFileSync('js/06-textures-renderer-setup.js','utf8');
          if(!setup.includes("loadGLTFCreature('jelly','assets/models/creature_jelly.gltf',{})"))throw new Error('shared project jelly loader missing');
          const core=fs.readFileSync('js/02-core-geometry.js','utf8');
          if(!core.includes('gjelly :')&&!core.includes('gjelly  :'))throw new Error('shared gjelly creature meta missing');
          console.log('ok: Aqua continues to reuse the established project jelly model and creature path');
          NODE

      - name: Verify Aqua v154 runtime wiring and offline cache
        run: |
          node - <<'NODE'
          const fs=require('fs'),R=f=>fs.readFileSync(f,'utf8');
          const loader=R('js/19-verdant-assets.js'),sw=R('sw.js');
          const scripts=[
            '49-aqua-rift-v143.js','50-aqua-real-fish-v144.js','51-aqua-fish-visibility-v145.js',
            '52-aqua-depth-distribution-v146.js','53-aqua-swim-motion-v147.js','54-aqua-tail-animation-v148.js',
            '55-aqua-uturn-continuity-v149.js','56-aqua-faces-reef-v150.js','57-aqua-coral-jelly-v151.js',
            '58-aqua-proper-jelly-reef-v152.js','59-aqua-hq-coral-v153.js','60-aqua-hero-coral-v154.js'];
          for(const f of scripts){
            if(!loader.includes(f+'?b=154'))throw new Error('Aqua v154 fresh loader wiring missing '+f);
            if(!sw.includes('js/'+f))throw new Error('Aqua offline cache missing '+f);
          }
          if(!sw.includes("lunar-ride-v142"))throw new Error('retained Verdant v142 service-worker cache missing');
          if(!loader.includes('48-verdant-mushroom-carpet-fix-v142.js?b=142'))throw new Error('Verdant v142 wiring was disturbed');
          if(!sw.includes('js/32-verdant-fauna-buildings-v121.js'))throw new Error('Verdant v121 cache entry was disturbed');
          if(!sw.includes('assets/models/creature_jelly.gltf'))throw new Error('project jelly asset missing from offline cache');
          const v152=R('js/58-aqua-proper-jelly-reef-v152.js');
          for(const k of ["VERSION=152","JELLY_COUNT=60","properProjectJelly:true","jellyAsset:'assets/models/creature_jelly.gltf'"])
            if(!v152.includes(k))throw new Error('Aqua v152 jelly regression marker missing '+k);
          const v153=R('js/59-aqua-hq-coral-v153.js');
          for(const k of ["VERSION=153","REEF_STATIONS=350","GROUPS_PER_SIDE=4","HERO_EVERY=5","hqCoral:true","hybridLOD:true","recognizableGeometry:true","proceduralSphereClustersReplaced:true"])
            if(!v153.includes(k))throw new Error('Aqua v153 HQ coral marker missing '+k);
          const v154=R('js/60-aqua-hero-coral-v154.js');
          for(const k of ["VERSION=154","HERO_GROUPS=280","heroClusters:true","reefPedestals:true","clusteredComposition:true","closeWallFeeling:true","heroClusterCount:heroClusters"])
            if(!v154.includes(k))throw new Error('Aqua v154 hero coral marker missing '+k);
          console.log('ok: Aqua v154 is wired after v153 with fresh cache busting, offline support and Verdant v142 isolation');
          NODE
