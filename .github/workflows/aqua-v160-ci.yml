name: Aqua v160 rocky shoulders + upper fish checks

on:
  push:
    branches: [fixes-build-90]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rocky-upper-fish-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aqua v160 syntax
        run: |
          node --check js/66-aqua-rocky-upperfish-v160.js
          node --check tests/aqua-v160-rocky-upperfish-smoke.js

      - name: Aqua v160 runtime regression
        run: node tests/aqua-v160-rocky-upperfish-smoke.js

      - name: Verify Aqua v160 wiring and provenance
        run: |
          node - <<'NODE'
          const fs=require('fs'),R=f=>fs.readFileSync(f,'utf8');
          const loader=R('js/19-verdant-assets.js'),sw=R('sw.js'),v=R('js/66-aqua-rocky-upperfish-v160.js'),p=R('assets/images/AQUA_ROCK_PROVENANCE.md');
          if(!loader.includes('66-aqua-rocky-upperfish-v160.js?b=160'))throw new Error('v160 loader wiring missing');
          if(!sw.includes('js/66-aqua-rocky-upperfish-v160.js'))throw new Error('v160 offline script cache missing');
          for(const k of ['rockyShoulders:true','sand03Retired:true','Rocks Ground 04','aquaUpperFishV160:true','UPPER_SCHOOLS=12','FISH_PER_UPPER_SCHOOL=5'])
            if(!v.includes(k))throw new Error('v160 marker missing '+k);
          if(!p.includes('CC0')||!p.includes('polyhaven.com/a/rocks_ground_04')||!p.includes('rocks_ground_04_diff_1k.jpg'))throw new Error('rock provenance incomplete');
          if(!loader.includes('65-aqua-sand-ab-v159.js?b=159'))throw new Error('v159 dependency wiring missing');
          if(!loader.includes('48-verdant-mushroom-carpet-fix-v142.js?b=142'))throw new Error('Verdant v142 wiring disturbed');
          console.log('ok: Aqua v160 is wired with full-lap rocky shoulders and upper-tunnel fish while Verdant v142 remains isolated');
          NODE
