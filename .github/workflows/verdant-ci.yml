name: Verdant Rift checks

on:
  push:
    branches: [fixes-build-90]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          for f in js/*.js; do node --check "$f"; done
          for f in tests/*.js; do node --check "$f"; done

      - name: Verdant generated-world smoke test
        run: node tests/verdant-smoke.js

      - name: Verdant real geometry load test
        run: timeout 35s node tests/verdant-real-mesh-smoke.js

      - name: Verdant wildlife runtime regression test
        run: node tests/verdant-lite-runtime-smoke.js

      - name: Verdant v121 fauna and buildings runtime test
        run: node tests/verdant-v121-fauna-buildings-smoke.js

      - name: Verdant v122 terrain and birds runtime test
        run: node tests/verdant-v122-terrain-birds-smoke.js

      - name: Verdant road and asset regression test
        run: node tests/verdant-v123-regression-smoke.js

      - name: Verdant v125 living wildlife regression test
        run: node tests/verdant-v125-wildlife-smoke.js

      - name: Verdant v126 full-route mountain regression test
        run: node tests/verdant-v126-mountains-smoke.js

      - name: Verdant v129 world cleanup regression test
        run: node tests/verdant-v129-world-cleanup-smoke.js

      - name: Validate creature and building assets
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const creatures=['verdant_bear.gltf','verdant_frog.gltf','verdant_monkey.gltf','verdant_ship.gltf',
            'creature_stag.gltf','creature_jelly.gltf','creature_cat.gltf','creature_dragonfly.gltf',
            'bird_kestrel.gltf','bird_gull.gltf','bird_finch.gltf','bird_ray.gltf'];
          const buildings=['station_side.gltf','station_hangar.gltf','station_antenna.gltf','station_gate.gltf',
            'station_refinery.gltf','station_ring.gltf','city_gate.gltf','city_dome.gltf','city_tower.gltf',
            'city_arcology.gltf','city_spire_pair.gltf','city_cluster.gltf'];
          for(const name of creatures.concat(buildings)){
            const f=path.join('assets/models',name),j=JSON.parse(fs.readFileSync(f,'utf8'));
            if(j.asset?.version!=='2.0'||!j.meshes?.length)throw new Error('invalid asset '+name);
            for(const b of (j.buffers||[]))if(b.uri&&!b.uri.startsWith('data:')&&!fs.existsSync(path.join(path.dirname(f),b.uri)))
              throw new Error(name+' missing buffer '+b.uri);
            for(const im of (j.images||[]))if(im.uri&&!im.uri.startsWith('data:')&&!fs.existsSync(path.join(path.dirname(f),im.uri)))
              throw new Error(name+' missing image '+im.uri);
            console.log('ok',name);
          }
          NODE

      - name: Validate imported nature dependencies
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const files=['CommonTree_1.gltf','CommonTree_3.gltf','CommonTree_5.gltf',
            'TwistedTree_1.gltf','TwistedTree_3.gltf','Pine_1.gltf','Pine_3.gltf','Pine_5.gltf','DeadTree_2.gltf',
            'Bush_Common.gltf','Bush_Common_Flowers.gltf','Fern_1.gltf','Flower_4_Group.gltf','Mushroom_Common.gltf',
            'Rock_Medium_1.gltf','Rock_Medium_2.gltf'];
          for(const name of files){
            const f=path.join('assets/models',name),j=JSON.parse(fs.readFileSync(f,'utf8'));
            for(const b of (j.buffers||[]))if(b.uri&&!b.uri.startsWith('data:')&&!fs.existsSync(path.join(path.dirname(f),b.uri)))
              throw new Error(name+' missing buffer '+b.uri);
            for(const im of (j.images||[]))if(im.uri&&!im.uri.startsWith('data:')&&!fs.existsSync(path.join(path.dirname(f),im.uri)))
              throw new Error(name+' missing image '+im.uri);
            console.log('ok',name);
          }
          NODE

      - name: Verdant v131 rejected-palm removal regression test
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const removed=[
            'js/39-verdant-photogrammetry-palms-v130.js',
            'assets/models/verdant_palm_hero_v130_part1.gltf','assets/models/verdant_palm_hero_v130_part2.gltf',
            'assets/models/verdant_palm_hero_v130_part3.gltf','assets/models/verdant_palm_hero_v130_part4.gltf',
            'assets/models/verdant_palm_lod_v130_part1.gltf','assets/models/verdant_palm_lod_v130_part2.gltf'
          ];
          for(const f of removed)if(fs.existsSync(f))throw new Error('rejected v130 palm asset still present: '+f);
          const loader=fs.readFileSync('js/19-verdant-assets.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          if(loader.includes('photogrammetry-palms')||loader.includes('verdant_palm_'))throw new Error('palm loader reference remains');
          if(sw.includes('photogrammetry-palms')||sw.includes('verdant_palm_'))throw new Error('palm cache reference remains');
          console.log('ok: rejected v130 palms are fully removed from the branch and runtime');
          NODE

      - name: Verdant v134 CommonTree 75-25 mix regression test
        run: node tests/verdant-v134-common-tree-mix-smoke.js

      - name: Verdant v136 exact CommonTree compact regression test
        run: node tests/verdant-v136-common-tree-compact-smoke.js

      - name: Verdant v137 TwistedTree 50-50 regression test
        run: node tests/verdant-v137-twisted-tree-mix-smoke.js

      - name: Verdant atmosphere and retained v128 mountain regression test
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const sky=fs.readFileSync('assets/images/sky_verdant.svg','utf8');
          const weather=fs.readFileSync('js/18-verdant-weather.js','utf8');
          const mountains=fs.readFileSync('js/35-verdant-mountains-v123.js','utf8');
          if((sky.match(/<path /g)||[]).length!==0)throw new Error('painted skyline paths must remain absent');
          if(!sky.includes('NO painted mountain')||!sky.includes('real 3-D terrain'))throw new Error('atmosphere-only skyline marker missing');
          if(!weather.includes('sky_verdant.svg?b=131'))throw new Error('retained v131 skyline cache-bust missing');
          for(const k of ['oldAlpine','H[v]-=oldA','alpineRidges','__verdantMountainsV128'])
            if(!mountains.includes(k))throw new Error('retained v128 alpine cleanup missing: '+k);
          console.log('ok: v137 retains v131 atmosphere and v128 legacy-dome removal');
          NODE

      - name: Verify current Verdant wiring
        run: |
          node - <<'NODE'
          const fs=require('fs'),R=f=>fs.readFileSync(f,'utf8');
          const loader=R('js/19-verdant-assets.js'),lite=R('js/25-verdant-lite-richness.js'),sw=R('sw.js');
          const mountains=R('js/35-verdant-mountains-v123.js'),m129=R('js/37-verdant-mountains-v129.js');
          const wild=R('js/36-verdant-wildlife-v125.js'),cleanup=R('js/38-verdant-world-cleanup-v129.js');
          for(const f of ['36-verdant-wildlife-v125.js','35-verdant-mountains-v123.js','37-verdant-mountains-v129.js','38-verdant-world-cleanup-v129.js'])
            if(!loader.includes(f+'?b=137'))throw new Error('v137 loader wiring missing '+f);
          if(!loader.includes('39-verdant-common-tree-mix-v134.js?b=137'))throw new Error('v134 CommonTree mix not retained');
          if(!loader.includes('41-verdant-common-tree-compact-v136.js?b=137'))throw new Error('v136 compact CommonTree not retained');
          if(!loader.includes('42-verdant-twisted-tree-mix-v137.js?b=137'))throw new Error('v137 TwistedTree mix loader missing');
          if(loader.includes('40-verdant-common-tree-structure-v135.js'))throw new Error('rejected v135 synthetic structure layer still active');
          if(!lite.includes("const RELEASE='137'"))throw new Error('v137 label missing');
          if(!sw.includes("lunar-ride-v137"))throw new Error('v137 cache missing');
          for(const f of ['39-verdant-common-tree-mix-v134.js','41-verdant-common-tree-compact-v136.js','42-verdant-twisted-tree-mix-v137.js'])
            if(!sw.includes(f))throw new Error('v137 cache missing '+f);
          if(!mountains.includes('ROAD_CORE=46')||!mountains.includes('FULL_REPLACE=ROAD_CORE+ROAD_FADE'))throw new Error('v126 full-route mountain protection missing');
          if(!mountains.includes('__verdantMountainsV128'))throw new Error('v128 mountain cleanup missing');
          if(!m129.includes('__verdantRoadbedV129')||!m129.includes('__verdantMountainsV129'))throw new Error('v129 terrain cleanup incomplete');
          if(!wild.includes('stagHerds')||!wild.includes('retunedFrogs')||!wild.includes('dragonflySwarms'))throw new Error('v125 wildlife layer incomplete');
          if(!cleanup.includes('legacyBillboardsDisabled:true')||!cleanup.includes('extraStagHerds'))throw new Error('v129 final cleanup incomplete');
          console.log('ok: current Verdant v137 preserves v136 and adds only 50/50 TwistedTree red variants');
          NODE
