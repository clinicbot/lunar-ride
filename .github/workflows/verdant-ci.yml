name: Verdant Rift checks

on:
  push:
    branches: [fixes-build-90]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check js/17-verdant-rift.js
          node --check js/18-verdant-weather.js
          node --check js/19-verdant-assets.js
          node --check js/20-verdant-route-audit.js
          node --check js/21-verdant-terrain-polish.js
          node --check js/22-verdant-visual-pass.js
          node --check js/23-verdant-depth-pass.js
          node --check js/24-verdant-release.js
          node --check js/25-verdant-lite-richness.js
          node --check js/26-verdant-real-nature.js
          node --check js/27-verdant-billboard-cleanup.js
          node --check js/28-verdant-instanced-renderer.js
          node --check js/29-verdant-density-v118.js
          node --check js/30-verdant-natural-v119.js
          node --check js/31-verdant-enrichment-v120.js
      - name: Verdant generated-world smoke test
        id: verdant
        shell: bash
        run: |
          set +e
          node tests/verdant-smoke.js 2>&1 | tee verdant-test.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verdant real geometry load test
        id: realmesh
        shell: bash
        run: |
          set +e
          timeout 35s node tests/verdant-real-mesh-smoke.js 2>&1 | tee verdant-real-mesh.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verdant wildlife runtime regression test
        run: node tests/verdant-lite-runtime-smoke.js 2>&1 | tee verdant-lite-runtime.log
      - name: Validate self-contained Verdant glTF files
        run: |
          node - <<'NODE' 2>&1 | tee gltf-test.log
          const fs=require('fs');
          for(const f of [
            'assets/models/verdant_bear.gltf',
            'assets/models/verdant_frog.gltf',
            'assets/models/verdant_monkey.gltf',
            'assets/models/verdant_ship.gltf']){
            const j=JSON.parse(fs.readFileSync(f,'utf8'));
            if(j.asset?.version!=='2.0'||!j.meshes?.length||!j.buffers?.[0]?.uri?.startsWith('data:'))
              throw new Error('invalid self-contained glTF: '+f);
            console.log('ok',f);
          }
          NODE
      - name: Validate external nature glTF dependencies
        run: |
          node - <<'NODE' 2>&1 | tee nature-assets.log
          const fs=require('fs'),path=require('path');
          const files=[
            'CommonTree_1.gltf','CommonTree_3.gltf','CommonTree_5.gltf',
            'TwistedTree_1.gltf','TwistedTree_3.gltf',
            'Pine_1.gltf','Pine_3.gltf','Pine_5.gltf','DeadTree_2.gltf',
            'Bush_Common.gltf','Bush_Common_Flowers.gltf','Fern_1.gltf',
            'Flower_4_Group.gltf','Mushroom_Common.gltf',
            'Rock_Medium_1.gltf','Rock_Medium_2.gltf'
          ];
          let total=0;
          for(const name of files){
            const f=path.join('assets/models',name),j=JSON.parse(fs.readFileSync(f,'utf8'));
            if(j.asset?.version!=='2.0'||!j.meshes?.length)throw new Error('invalid glTF '+name);
            const refs=[];
            for(const b of (j.buffers||[]))if(b.uri&&!b.uri.startsWith('data:'))refs.push(b.uri);
            for(const im of (j.images||[]))if(im.uri&&!im.uri.startsWith('data:'))refs.push(im.uri);
            for(const ref of refs){
              const p=path.resolve(path.dirname(f),ref);
              if(!fs.existsSync(p))throw new Error(name+' missing dependency '+ref);
            }
            const tris=(j.meshes||[]).flatMap(m=>m.primitives||[]).reduce((s,p)=>{
              const a=j.accessors[p.indices];return s+(a?Math.floor(a.count/3):0);
            },0);
            total+=tris;
            console.log('ok',name,'triangles',tris,'dependencies',refs.length);
          }
          console.log('source asset triangles',total);
          NODE
      - name: Verify instancing and v120 enrichment architecture
        run: |
          node - <<'NODE' 2>&1 | tee instancing-architecture.log
          const fs=require('fs');
          const src=fs.readFileSync('js/26-verdant-real-nature.js','utf8');
          const nat=fs.readFileSync('js/30-verdant-natural-v119.js','utf8');
          const rich=fs.readFileSync('js/31-verdant-enrichment-v120.js','utf8');
          const ren=fs.readFileSync('js/28-verdant-instanced-renderer.js','utf8');
          const clean=fs.readFileSync('js/27-verdant-billboard-cleanup.js','utf8');
          const loader=fs.readFileSync('js/19-verdant-assets.js','utf8');
          const lite=fs.readFileSync('js/25-verdant-lite-richness.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          if(!src.includes('w.instNature='))throw new Error('instance plan missing');
          if(src.includes('mergeProps(w'))throw new Error('imported nature must not bake into props');
          if(!nat.includes('I.naturalV119=stats')||!nat.includes('stats.groves++')||!nat.includes('heroTrees'))
            throw new Error('v119 natural grove distribution missing');
          if(!rich.includes('I.enrichmentV120=stats')||!rich.includes('Visible animal encounters')||!rich.includes('Background forest depth'))
            throw new Error('v120 habitat/encounter enrichment missing');
          if(!rich.includes("a.gcre='vbear'")||!rich.includes('headPitch:0')||!rich.includes('pinY=py'))
            throw new Error('v120 late-added actor runtime state incomplete');
          if(!loader.includes('31-verdant-enrichment-v120.js')||!loader.includes('30-verdant-natural-v119.js'))
            throw new Error('v120 loader wiring incorrect');
          if(!lite.includes("const RELEASE='120'"))throw new Error('v120 release label missing');
          if(!sw.includes("lunar-ride-v120")||!sw.includes('js/31-verdant-enrichment-v120.js'))
            throw new Error('v120 service-worker cache wiring missing');
          if(!ren.includes('drawArraysInstanced')||!ren.includes('ANGLE_instanced_arrays'))
            throw new Error('WebGL instancing paths missing');
          if(!ren.includes('circularKm')||!ren.includes('DYNAMIC_DRAW'))
            throw new Error('streaming visibility update missing');
          if(!ren.includes('hash21')||!ren.includes('greenish'))
            throw new Error('natural foliage shading missing');
          if(!clean.includes('w.veg=null'))throw new Error('legacy Verdant billboard buffers still uploaded');
          console.log('ok: streamed GPU instancing + v119 forest + v120 enrichment present');
          NODE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdant-check-output
          path: |
            verdant-test.log
            verdant-real-mesh.log
            verdant-lite-runtime.log
            gltf-test.log
            nature-assets.log
            instancing-architecture.log
      - name: Fail if generated-world test failed
        if: steps.verdant.outputs.exit_code != '0' || steps.realmesh.outputs.exit_code != '0'
        run: exit 1
