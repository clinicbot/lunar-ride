name: Verdant Rift checks

on:
  push:
    branches: [fixes-build-90]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          for f in js/*.js; do node --check "$f"; done
          for f in tests/*.js; do node --check "$f"; done

      - name: Verdant generated-world smoke test
        run: node tests/verdant-smoke.js

      - name: Verdant real geometry load test
        run: timeout 35s node tests/verdant-real-mesh-smoke.js

      - name: Verdant wildlife runtime regression test
        run: node tests/verdant-lite-runtime-smoke.js

      - name: Verdant v121 fauna and buildings runtime test
        run: node tests/verdant-v121-fauna-buildings-smoke.js

      - name: Verdant v122 terrain and birds runtime test
        run: node tests/verdant-v122-terrain-birds-smoke.js

      - name: Verdant road and asset regression test
        run: node tests/verdant-v123-regression-smoke.js

      - name: Verdant v125 living wildlife regression test
        run: node tests/verdant-v125-wildlife-smoke.js

      - name: Verdant v126 full-route mountain regression test
        run: node tests/verdant-v126-mountains-smoke.js

      - name: Validate creature and building assets
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const creatures=['verdant_bear.gltf','verdant_frog.gltf','verdant_monkey.gltf','verdant_ship.gltf',
            'creature_stag.gltf','creature_jelly.gltf','creature_cat.gltf','creature_dragonfly.gltf',
            'bird_kestrel.gltf','bird_gull.gltf','bird_finch.gltf','bird_ray.gltf'];
          const buildings=['station_side.gltf','station_hangar.gltf','station_antenna.gltf','station_gate.gltf',
            'station_refinery.gltf','station_ring.gltf','city_gate.gltf','city_dome.gltf','city_tower.gltf',
            'city_arcology.gltf','city_spire_pair.gltf','city_cluster.gltf'];
          for(const name of creatures.concat(buildings)){
            const f=path.join('assets/models',name),j=JSON.parse(fs.readFileSync(f,'utf8'));
            if(j.asset?.version!=='2.0'||!j.meshes?.length)throw new Error('invalid asset '+name);
            for(const b of (j.buffers||[]))if(b.uri&&!b.uri.startsWith('data:')&&!fs.existsSync(path.join(path.dirname(f),b.uri)))
              throw new Error(name+' missing buffer '+b.uri);
            for(const im of (j.images||[]))if(im.uri&&!im.uri.startsWith('data:')&&!fs.existsSync(path.join(path.dirname(f),im.uri)))
              throw new Error(name+' missing image '+im.uri);
            console.log('ok',name);
          }
          NODE

      - name: Validate imported nature dependencies
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const files=['CommonTree_1.gltf','CommonTree_3.gltf','CommonTree_5.gltf',
            'TwistedTree_1.gltf','TwistedTree_3.gltf','Pine_1.gltf','Pine_3.gltf','Pine_5.gltf','DeadTree_2.gltf',
            'Bush_Common.gltf','Bush_Common_Flowers.gltf','Fern_1.gltf','Flower_4_Group.gltf','Mushroom_Common.gltf',
            'Rock_Medium_1.gltf','Rock_Medium_2.gltf'];
          for(const name of files){
            const f=path.join('assets/models',name),j=JSON.parse(fs.readFileSync(f,'utf8'));
            for(const b of (j.buffers||[]))if(b.uri&&!b.uri.startsWith('data:')&&!fs.existsSync(path.join(path.dirname(f),b.uri)))
              throw new Error(name+' missing buffer '+b.uri);
            for(const im of (j.images||[]))if(im.uri&&!im.uri.startsWith('data:')&&!fs.existsSync(path.join(path.dirname(f),im.uri)))
              throw new Error(name+' missing image '+im.uri);
            console.log('ok',name);
          }
          NODE

      - name: Verdant v127 atmospheric skyline regression test
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const sky=fs.readFileSync('assets/images/sky_verdant.svg','utf8');
          const weather=fs.readFileSync('js/18-verdant-weather.js','utf8');
          if(sky.includes('#456348')||sky.includes('#294b38')||sky.includes('#1e3d2e'))
            throw new Error('legacy cartoon green skyline/tree palette still present');
          if((sky.match(/<path /g)||[]).length<3)
            throw new Error('atmospheric mountain layers missing');
          if(!sky.includes('Distant mountain chains')||!sky.includes('angular, irregular'))
            throw new Error('v127 skyline marker missing');
          if(!weather.includes('sky_verdant.svg?b=127'))
            throw new Error('v127 skyline cache-bust missing');
          console.log('ok: v127 atmospheric skyline replaced legacy domes/triangles');
          NODE

      - name: Verify current Verdant wiring
        run: |
          node - <<'NODE'
          const fs=require('fs'),R=f=>fs.readFileSync(f,'utf8');
          const loader=R('js/19-verdant-assets.js'),lite=R('js/25-verdant-lite-richness.js'),sw=R('sw.js');
          const mountains=R('js/35-verdant-mountains-v123.js'),wild=R('js/36-verdant-wildlife-v125.js');
          if(!loader.includes('36-verdant-wildlife-v125.js?b=127'))throw new Error('v127 wildlife loader missing');
          if(!loader.includes('35-verdant-mountains-v123.js?b=127'))throw new Error('v127 mountain loader missing');
          if(!lite.includes("const RELEASE='127'"))throw new Error('v127 label missing');
          if(!sw.includes("lunar-ride-v127"))throw new Error('v127 cache missing');
          if(!sw.includes("assets/images/sky_verdant.svg"))throw new Error('v127 skyline not cached');
          if(!mountains.includes('ROAD_CORE=46')||!mountains.includes('FULL_REPLACE=ROAD_CORE+ROAD_FADE'))
            throw new Error('v126 full-route mountain protection missing');
          if(!wild.includes('stagHerds')||!wild.includes('retunedFrogs')||!wild.includes('dragonflySwarms'))
            throw new Error('v125 wildlife layer incomplete');
          console.log('ok: current Verdant v127 wiring');
          NODE
